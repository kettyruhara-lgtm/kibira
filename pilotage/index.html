<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Pilotage des équipes — Fondation Kibira</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{
 --bark:#0E1B2E; --bark-2:#17273F; --bark-line:#283B55;
 --leaf:#4C8E20; --leaf-lift:#7BC748; --leaf-soft:#EDF5E3; --gold:#D9A03F;
 --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
 --bg:#F7F8FA; --card:#FFFFFF; --line:#E4E7EC; --line-2:#CFD5DE;
 --ink:#141C26; --ink-2:#525E6E; --ink-3:#8792A2;
 --amber:#9A6E12; --amber-soft:#FBF3DF; --clay:#9E3B2C; --clay-soft:#FAEAE6;
 --blue:#2C5A87; --blue-soft:#E8EFF6;
 --sh:0 1px 2px rgba(14,27,46,.05),0 12px 28px -16px rgba(14,27,46,.28);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:"Source Sans 3",ui-sans-serif,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.6}
h1,h2,h3{font-family:Newsreader,ui-serif,Georgia,serif;margin:0;font-weight:600;text-wrap:balance}
.wrap{max-width:1080px;margin:0 auto;padding:0 28px}
.hero{background:var(--bark);color:#EDF2F8;padding:24px 0 28px;position:relative}
.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;
 background:linear-gradient(90deg,var(--leaf-lift) 0%,var(--leaf) 45%,var(--bark-line) 100%)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.logo{display:inline-flex;align-items:center;gap:13px}
.logo img{height:88px;display:block}
.logo .wm{font-family:var(--mono);font-size:10.5px;letter-spacing:.20em;text-transform:uppercase;
 color:var(--gold);font-weight:600;padding-left:15px;border-left:1px solid var(--bark-line)}
.back{color:#A8B8CC;text-decoration:none;font-size:13.4px;border:1px solid var(--bark-line);
 border-radius:99px;padding:6px 14px}
.back:hover{border-color:var(--gold);color:#fff}
.hero h1{font-size:clamp(25px,3.3vw,34px);margin-top:14px;color:#F4F7FB;letter-spacing:-.02em;line-height:1.14}
.hero p{color:#A8B8CC;font-size:15.2px;max-width:72ch;margin:9px 0 0}
main{padding:30px 0 90px}

.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.tab{border:1px solid var(--line-2);background:#fff;color:var(--ink-2);border-radius:99px;
 padding:8px 16px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.tab:hover{border-color:var(--leaf)}
.tab[aria-pressed="true"]{background:var(--bark);border-color:var(--bark);color:#fff}
.btn{border:1px solid var(--line-2);background:#fff;border-radius:9px;padding:9px 16px;
 font:inherit;font-size:14.4px;font-weight:600;cursor:pointer;color:var(--ink)}
.btn.p{background:var(--leaf);border-color:var(--leaf);color:#fff}
.btn.p:hover{background:#3D7419}
.btn:disabled{opacity:.45;cursor:not-allowed}
.spacer{flex:1}
.state{font-size:13.4px;color:var(--ink-3);font-family:var(--mono)}

.dept{margin-bottom:34px}
.dept-h{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--leaf);padding-bottom:8px;flex-wrap:wrap}
.dept-h h2{font-size:21px}
.dept-h .who{font-size:13.2px;color:var(--ink-3);font-family:var(--mono)}
.dept-h .n{margin-left:auto;font-size:12.6px;color:var(--ink-3);font-family:var(--mono)}
.grp{margin-top:16px}
.grp>h3{font-family:"Source Sans 3",sans-serif;font-size:11px;letter-spacing:.13em;text-transform:uppercase;
 font-weight:700;color:var(--ink-3);margin-bottom:9px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:12px}
.c{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--leaf);
 border-radius:3px 11px 11px 3px;padding:14px 16px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:7px}
.c.act{border-left-color:var(--blue)} .c.upd{border-left-color:var(--gold)}
.c-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:9.8px;letter-spacing:.09em;text-transform:uppercase;
 border-radius:6px;padding:3px 8px;background:var(--leaf-soft);color:#356312;border:1px solid #B7D69B}
.chip.todo{background:#EEF1F5;color:var(--ink-2);border-color:var(--line-2)}
.chip.doing{background:var(--blue-soft);color:var(--blue);border-color:#B9CEE3}
.chip.done{background:var(--leaf-soft);color:#356312;border-color:#B7D69B}
.chip.late{background:var(--clay-soft);color:var(--clay);border-color:#E6BDB1}
.c h4{margin:0;font-size:15.4px;font-weight:700;color:var(--ink);line-height:1.32;font-family:inherit}
.c p{margin:0;font-size:13.8px;color:var(--ink-2);line-height:1.5;white-space:pre-wrap}
.meta{font-family:var(--mono);font-size:11.4px;color:var(--ink-3);display:flex;gap:12px;flex-wrap:wrap}
.kpi{background:#F5F7F9;border:1px dashed var(--line-2);border-radius:8px;padding:7px 10px;font-size:12.8px;color:var(--ink-2)}
.kpi b{color:var(--ink)}
.prog{height:5px;background:#EEF1F5;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--leaf);border-radius:99px}
.del{align-self:flex-start;border:0;background:none;color:var(--ink-3);font:inherit;font-size:12px;
 cursor:pointer;padding:0;text-decoration:underline}
.del:hover{color:var(--clay)}
.empty{color:var(--ink-3);font-size:14.6px;padding:10px 0}

dialog{border:1px solid var(--line);background:#fff;border-radius:15px;padding:0;max-width:min(620px,94vw);box-shadow:var(--sh)}
dialog::backdrop{background:rgba(14,27,46,.55)}
form.d{padding:24px 26px;display:flex;flex-direction:column;gap:13px}
form.d h3{font-size:21px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--ink-2)}
label span.h{font-weight:400;color:var(--ink-3);font-size:12.4px}
input,select,textarea{font:inherit;font-size:15px;border:1px solid var(--line-2);border-radius:8px;
 padding:9px 11px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:78px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--leaf);outline-offset:1px;border-color:var(--leaf)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.msg{font-size:13.6px;padding:9px 11px;border-radius:8px;display:none}
.msg.ok{display:block;background:var(--leaf-soft);color:#356312}
.msg.err{display:block;background:var(--clay-soft);color:var(--clay)}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
</style></head><body>

<script>
var EP = "https://script.google.com/macros/s/AKfycbyuz5-bhV8_th56y55Nk3o6c6JvN93uB9x6MSTewaVFNKq-KMAMSBOaBOTs0V-qNRCP/exec";
var DEPTS = ["Mobilisation des ressources", "Communication", "Engagement des parties prenantes", "Programmes et terrain"];
var rows = [], filt = "";
var $ = function(s){ return document.querySelector(s); };

function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function statusChip(st, ech){
  var k = st==="Fait"?"done" : st==="En cours"?"doing" : st==="Bloqué"?"late" : "todo";
  var late = ech && st!=="Fait" && new Date(ech) < new Date();
  return '<span class="chip '+(late?"late":k)+'">'+esc(late?"En retard — "+st:st||"À faire")+'</span>';
}
function card(r){
  var cls = r.type==="action" ? "act" : r.type==="update" ? "upd" : "";
  var h = '<div class="c '+cls+'"><div class="c-top">';
  h += '<span class="chip">'+ (r.type==="objectif"?"Objectif":r.type==="action"?"Action":"Avancement") +'</span>';
  if(r.type!=="update") h += statusChip(r.statut, r.echeance);
  h += '</div><h4>'+esc(r.titre)+'</h4>';
  if(r.detail) h += '<p>'+esc(r.detail)+'</p>';
  if(r.indicateur || r.cible)
    h += '<div class="kpi"><b>Indicateur —</b> '+esc(r.indicateur||"—")+(r.cible?' · <b>Cible —</b> '+esc(r.cible):'')+'</div>';
  if(r.avancement!=="" && r.avancement!=null && r.type!=="update")
    h += '<div class="prog"><i style="width:'+Math.max(0,Math.min(100,parseInt(r.avancement)||0))+'%"></i></div>';
  var m = [];
  if(r.auteur) m.push(esc(r.auteur));
  if(r.echeance) m.push("échéance "+esc(String(r.echeance).slice(0,10)));
  if(r.horodatage) m.push(esc(String(r.horodatage).slice(0,10)));
  h += '<div class="meta">'+m.join(" · ")+'</div>';
  h += '<button class="del" data-id="'+esc(r.id)+'">Supprimer</button>';
  return h + '</div>';
}
function render(){
  var b = $("#board"); b.innerHTML = "";
  var list = DEPTS.filter(function(d){ return !filt || d===filt; });
  var any = false;
  list.forEach(function(d){
    var mine = rows.filter(function(r){ return r.departement===d; });
    if(!mine.length && filt!==d) return;
    any = true;
    var sec = '<section class="dept"><div class="dept-h"><h2>'+esc(d)+'</h2>'
            + '<span class="n">'+mine.length+' élément'+(mine.length>1?"s":"")+'</span></div>';
    [["objectif","Objectifs SMART"],["action","Plan d’action"],["update","Points d’avancement"]].forEach(function(g){
      var set = mine.filter(function(r){ return r.type===g[0]; });
      if(!set.length) return;
      set.sort(function(a,z){ return (z.horodatage||"").localeCompare(a.horodatage||""); });
      sec += '<div class="grp"><h3>'+g[1]+'</h3><div class="cards">'+set.map(card).join("")+'</div></div>';
    });
    if(!mine.length) sec += '<p class="empty">Rien pour cette équipe pour le moment.</p>';
    b.insertAdjacentHTML("beforeend", sec + '</section>');
  });
  if(!any) b.innerHTML = '<p class="empty">Aucun élément enregistré. Utilisez « + Ajouter » pour commencer.</p>';
  b.querySelectorAll(".del").forEach(function(x){ x.onclick = function(){ del(x.getAttribute("data-id")); }; });
}
function load(){
  $("#state").textContent = "chargement…";
  fetch(EP + "?what=board&t=" + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(!j.ok) throw new Error(j.error||"refus");
      rows = j.rows || [];
      $("#state").textContent = rows.length + " élément" + (rows.length>1?"s":"");
      render();
    })
    .catch(function(){
      $("#state").textContent = "lecture impossible";
      $("#board").innerHTML = '<p class="empty">Impossible de lire le tableau. Le service n’a peut-être pas encore été redéployé.</p>';
    });
}
function del(id){
  var k = prompt("Clé d’équipe pour supprimer :");
  if(!k) return;
  fetch(EP, {method:"POST", body: JSON.stringify({action:"delete", id:id, key:k})})
    .then(function(r){ return r.json(); })
    .then(function(j){ if(j.ok) load(); else alert(j.error||"échec"); })
    .catch(function(){ alert("échec de la suppression"); });
}
document.querySelectorAll(".tab").forEach(function(t){
  t.onclick = function(){
    filt = t.getAttribute("data-d");
    document.querySelectorAll(".tab").forEach(function(x){
      x.setAttribute("aria-pressed", x.getAttribute("data-d")===filt ? "true":"false"); });
    render();
  };
});
$("#reload").onclick = load;
$("#add").onclick = function(){ $("#fmsg").className="msg"; $("#dlg").showModal(); };
$("#ftype").onchange = function(){
  document.querySelector(".g-obj").style.display = $("#ftype").value==="objectif" ? "" : "none";
};
$("#f").addEventListener("submit", function(ev){
  if(ev.submitter && ev.submitter.value==="cancel") return;
  ev.preventDefault();
  var fd = new FormData($("#f")), p = {action:"board"};
  fd.forEach(function(v,k){ p[k]=v; });
  $("#save").disabled = true;
  $("#fmsg").className="msg"; $("#fmsg").textContent="";
  fetch(EP, {method:"POST", body: JSON.stringify(p)})
    .then(function(r){ return r.json(); })
    .then(function(j){
      $("#save").disabled = false;
      if(j.ok){ $("#dlg").close(); $("#f").reset(); load(); }
      else { $("#fmsg").className="msg err"; $("#fmsg").textContent = j.error==="cle invalide" ? "Clé d’équipe incorrecte." : ("Échec : "+j.error); }
    })
    .catch(function(){
      $("#save").disabled = false;
      $("#fmsg").className="msg err";
      $("#fmsg").textContent = "Envoi impossible. Vérifiez la connexion, ou le service n’a pas encore été redéployé.";
    });
});
$("#ftype").onchange();
load();
</script></body></html>
