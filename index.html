<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<title>Profil de financement Kibira</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
:root{
  /* canvas */
  --bg:#F6F8F7; --surface:#FFFFFF; --surface-2:#EFF3F1; --surface-3:#E4EBE7;
  --line:#E0E6E3; --line-strong:#C6CFCB;
  --ink:#1C2320; --ink-2:#55605B; --ink-3:#828C87;
  --display:#1B3A2C;
  --green:#2E6B4A; --green-ink:#245740; --green-soft:#E6F1EB;
  --gold:#2E6B4A; --gold-soft:#EDF2F0;
  --notice:#8A6A1E; --notice-soft:#F6F1E1;
  --clay:#9A3B1C;
  /* chrome: graphite */
  --chrome:#1E262A; --chrome-2:#273338; --chrome-line:#374850; --chrome-hover:#273338;
  --chrome-ink:#E9EFEC; --chrome-ink-2:#9FB2AC; --chrome-ink-3:#7A8D88;
  --chrome-accent:#7FBF9A; --chrome-on:#132420;
  --shadow:0 1px 2px rgba(28,35,32,.05), 0 10px 26px -14px rgba(28,35,32,.24);
  --shadow-lift:0 2px 5px rgba(28,35,32,.08), 0 22px 46px -20px rgba(28,35,32,.34);
  --focus:#2E6B4A;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1412; --surface:#151C19; --surface-2:#1C2420; --surface-3:#25302B;
    --line:#28332E; --line-strong:#3B4A44;
    --ink:#E9EFEC; --ink-2:#A8B8B2; --ink-3:#7E8D88;
    --display:#A8D8BE;
    --green:#6FB58A; --green-ink:#8ACBA4; --green-soft:#16241D;
    --gold:#8ACBA4; --gold-soft:#1A2320;
    --notice:#D5A94A; --notice-soft:#26210F;
    --clay:#E38562;
    --chrome:#0C1211; --chrome-2:#131B18; --chrome-line:#24302B; --chrome-hover:#1A2320;
    --chrome-ink:#E9EFEC; --chrome-ink-2:#96A9A3; --chrome-ink-3:#71827D;
    --chrome-accent:#7FBF9A; --chrome-on:#132420;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 26px -14px rgba(0,0,0,.8);
    --shadow-lift:0 2px 5px rgba(0,0,0,.6), 0 22px 46px -20px rgba(0,0,0,.9);
    --focus:#8ACBA4;
  }
}
:root[data-theme="dark"]{
    --bg:#0E1412; --surface:#151C19; --surface-2:#1C2420; --surface-3:#25302B;
  --line:#28332E; --line-strong:#3B4A44;
  --ink:#E9EFEC; --ink-2:#A8B8B2; --ink-3:#7E8D88;
  --display:#A8D8BE;
  --green:#6FB58A; --green-ink:#8ACBA4; --green-soft:#16241D;
  --gold:#8ACBA4; --gold-soft:#1A2320;
  --notice:#D5A94A; --notice-soft:#26210F;
  --clay:#E38562;
  --chrome:#0C1211; --chrome-2:#131B18; --chrome-line:#24302B; --chrome-hover:#1A2320;
  --chrome-ink:#E9EFEC; --chrome-ink-2:#96A9A3; --chrome-ink-3:#71827D;
  --chrome-accent:#7FBF9A; --chrome-on:#132420;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 26px -14px rgba(0,0,0,.8);
  --shadow-lift:0 2px 5px rgba(0,0,0,.6), 0 22px 46px -20px rgba(0,0,0,.9);
  --focus:#8ACBA4;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Source Sans 3", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size:16.5px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:Newsreader, ui-serif, Georgia, "Times New Roman", serif; color:var(--display); margin:0; text-wrap:balance; font-optical-sizing:auto}
:focus-visible{outline:2.5px solid var(--focus); outline-offset:2px; border-radius:4px}
button{font:inherit; color:inherit; cursor:pointer}
input,select,textarea{font:inherit; color:inherit}
.mono{font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric:tabular-nums}

.topbar{
  position:sticky; top:0; z-index:60; background:var(--chrome);
  border-bottom:1px solid var(--chrome-line); display:flex; align-items:center; gap:16px;
  padding:11px 22px; min-height:64px; color:var(--chrome-ink);
}
.brand{display:flex; align-items:center; gap:12px; min-width:0}
.brand svg{flex:none; display:block}
.brand-name{font-family:Newsreader,serif; font-weight:600; font-size:18px; letter-spacing:-.005em; color:var(--chrome-ink); line-height:1.15; white-space:nowrap}
.brand-sub{font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--chrome-accent); font-weight:700; margin-top:2px}
.topbar-spacer{flex:1}
.saveflag{
  display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--chrome-ink-2);
  background:var(--chrome-2); border:1px solid var(--chrome-line); border-radius:999px; padding:5px 13px 5px 10px; white-space:nowrap;
}
.saveflag .dot{width:7px;height:7px;border-radius:50%;background:var(--chrome-accent);flex:none}
.saveflag.saving .dot{background:var(--notice)}
.langtog{display:flex; border:1px solid var(--chrome-line); border-radius:999px; overflow:hidden; background:var(--chrome-2)}
.langtog button{border:0; background:transparent; padding:5px 14px; font-size:12.5px; font-weight:700; color:var(--chrome-ink-3); letter-spacing:.06em}
.langtog button:hover{color:var(--chrome-ink)}
.langtog button[aria-pressed="true"]{background:var(--chrome-accent); color:var(--chrome-on)}
.iconbtn{border:1px solid var(--chrome-line); background:var(--chrome-2); border-radius:9px; width:36px; height:34px; display:grid; place-items:center; color:var(--chrome-ink-2)}
.iconbtn:hover{background:var(--chrome-line); color:var(--chrome-ink)}

.shell{display:grid; grid-template-columns:290px minmax(0,1fr); align-items:start}
.rail{
  position:sticky; top:64px; height:calc(100dvh - 64px); overflow-y:auto;
  border-right:1px solid var(--chrome-line); background:var(--chrome);
  padding:22px 14px 24px; display:flex; flex-direction:column; gap:3px; color:var(--chrome-ink-2);
}
.rail-head{padding:2px 9px 14px; display:flex; flex-direction:column; gap:9px}
.rail-title{font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--chrome-ink-3); font-weight:700}
.overall{display:flex; align-items:baseline; gap:9px}
.overall b{font-family:Newsreader,serif; font-size:34px; font-weight:600; color:var(--chrome-ink); line-height:1}
.overall span{font-size:12.5px; color:var(--chrome-ink-3)}
.bar{height:5px; background:var(--chrome-line); border-radius:99px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--chrome-accent); border-radius:99px; transition:width .4s cubic-bezier(.4,0,.2,1)}
.navitem{
  display:grid; grid-template-columns:20px 1fr auto; align-items:center; gap:11px;
  border:0; background:transparent; text-align:left; width:100%;
  padding:9px 10px; border-radius:9px; color:var(--chrome-ink-2); font-size:14.4px; line-height:1.32;
}
.navitem:hover{background:var(--chrome-2); color:var(--chrome-ink)}
.navitem[aria-current="true"]{background:var(--chrome-accent); color:var(--chrome-on); font-weight:600}
.navnum{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--chrome-ink-3); text-align:center}
.navitem[aria-current="true"] .navnum{color:#2C5445}
.navring{width:17px;height:17px;flex:none}
.navring circle{fill:none; stroke-width:3}
.navring .trk{stroke:var(--chrome-line)}
.navring .val{stroke:var(--chrome-accent); stroke-linecap:round; transform:rotate(-90deg); transform-origin:50% 50%; transition:stroke-dasharray .4s ease}
.navitem[aria-current="true"] .navring .trk{stroke:rgba(19,36,32,.26)}
.navitem[aria-current="true"] .navring .val{stroke:var(--chrome-on)}
.rail-foot{margin-top:auto; padding:16px 9px 0; border-top:1px solid var(--chrome-line); display:flex; flex-direction:column; gap:6px}
.railbtn{border:1px solid var(--chrome-line); background:transparent; border-radius:9px; padding:8px 12px; font-size:13.4px; color:var(--chrome-ink-2); text-align:left; display:flex; align-items:center; gap:10px}
.railbtn:hover{border-color:var(--chrome-accent); color:var(--chrome-ink); background:var(--chrome-2)}
.railbtn svg{flex:none; color:var(--chrome-ink-3)}
.railbtn:hover svg{color:var(--chrome-accent)}

.main{padding:38px 44px 130px; max-width:860px}
.eyebrow{font-size:10.5px; letter-spacing:.15em; text-transform:uppercase; font-weight:700; color:var(--gold); display:flex; align-items:center; gap:11px; margin-bottom:13px}
.eyebrow .rule{height:1px; background:var(--line-strong); flex:1; max-width:56px}
h2.sec-title{font-size:clamp(28px,3.6vw,38px); font-weight:600; letter-spacing:-.018em; line-height:1.1}
.sec-intro{color:var(--ink-2); font-size:16.5px; max-width:60ch; margin-top:12px}

.qlist{display:flex; flex-direction:column; margin-top:28px}
.q{border:1px solid var(--line); background:var(--surface); border-radius:13px; padding:18px 20px; display:flex; flex-direction:column; gap:11px; transition:border-color .18s, box-shadow .18s}
.q + .q{margin-top:13px}
.q:focus-within{border-color:var(--green); box-shadow:var(--shadow)}
.q.done{border-left:3px solid var(--green); padding-left:18px}
.qlab{display:flex; align-items:flex-start; gap:12px}
.qnum{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--gold); padding-top:4px; flex:none; min-width:22px; font-weight:500}
.qtext{font-size:16.5px; font-weight:600; color:var(--ink); line-height:1.42}
.qtext .req{color:var(--clay); font-weight:400}
.qhint{font-size:13.8px; color:var(--ink-3); margin:-4px 0 0 34px; max-width:62ch; line-height:1.5}
.qbody{margin-left:34px}
@media (max-width:640px){ .qhint,.qbody{margin-left:0} }

input[type=text], input[type=number], textarea, select{
  width:100%; background:var(--surface-2); border:1px solid var(--line-strong);
  border-radius:9px; padding:10px 13px; font-size:15.5px; color:var(--ink);
  transition:border-color .15s, background .15s;
}
textarea{min-height:90px; resize:vertical; line-height:1.55}
input:focus, textarea:focus, select:focus{border-color:var(--green); background:var(--surface)}
input::placeholder, textarea::placeholder{color:var(--ink-3); opacity:.7}
.opts{display:flex; flex-direction:column; gap:7px}
.opts.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:7px}
.opt{display:flex; align-items:flex-start; gap:10px; border:1px solid var(--line-strong); background:var(--surface-2); border-radius:9px; padding:9px 13px; font-size:14.9px; cursor:pointer; line-height:1.42; transition:border-color .15s, background .15s}
.opt:hover{border-color:var(--green)}
.opt input{margin:3px 0 0; accent-color:var(--green); flex:none; width:16px; height:16px}
.opt.sel{background:var(--green-soft); border-color:var(--green); color:var(--green-ink); font-weight:600}
.otherbox{margin-top:9px; padding-left:13px; border-left:2px solid var(--green)}
.otherbox input{background:var(--surface)}
.money{display:flex; align-items:center}
.money span{background:var(--surface-3); border:1px solid var(--line-strong); border-right:0; border-radius:9px 0 0 9px; padding:10px 13px; font-size:13.5px; color:var(--ink-2); font-weight:700; letter-spacing:.04em}
.money input{border-radius:0 9px 9px 0}

/* repeatable project cards */
.grp{display:flex; flex-direction:column; gap:12px}
.grp-card{border:1px solid var(--line-strong); background:var(--surface-2); border-radius:12px; padding:15px 16px; display:flex; flex-direction:column; gap:11px; position:relative}
.grp-head{display:flex; align-items:center; justify-content:space-between; gap:10px}
.grp-head b{font-family:Newsreader,serif; font-size:15.5px; color:var(--display); font-weight:600}
.grp-del{border:1px solid var(--line-strong); background:var(--surface); border-radius:8px; width:30px; height:30px; display:grid; place-items:center; color:var(--ink-3); font-size:16px; line-height:1}
.grp-del:hover{border-color:var(--clay); color:var(--clay)}
.grp-fields{display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:10px}
.grp-f{display:flex; flex-direction:column; gap:5px}
.grp-f.wide{grid-column:1/-1}
.grp-f label{font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); font-weight:700}
.grp-f input, .grp-f textarea{background:var(--surface); padding:8px 11px; font-size:14.8px}
.grp-f textarea{min-height:62px}
.grp-add{align-self:flex-start; border:1px dashed var(--line-strong); background:transparent; border-radius:9px; padding:9px 16px; font-size:13.8px; color:var(--green-ink); font-weight:600}
.grp-add:hover{border-color:var(--green); background:var(--green-soft)}

.pager{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:34px; flex-wrap:wrap}
.btn{border:1px solid var(--line-strong); background:var(--surface); border-radius:10px; padding:11px 19px; font-size:15px; font-weight:600; color:var(--ink); display:inline-flex; align-items:center; gap:9px; transition:border-color .15s, background .15s}
.btn:hover{border-color:var(--green)}
.btn.primary{background:var(--green); border-color:var(--green); color:#F6F8F7}
:root[data-theme="dark"] .btn.primary{color:#0E1412}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0E1412}}
.btn.primary:hover{background:var(--green-ink); border-color:var(--green-ink)}
.btn:disabled{opacity:.35; cursor:not-allowed}
.btn.big{padding:14px 28px; font-size:16.5px}

.toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(16px); background:#1E262A; color:#E9EFEC; padding:13px 22px; border-radius:11px; font-size:14.6px; box-shadow:var(--shadow-lift); opacity:0; pointer-events:none; transition:opacity .22s, transform .22s; z-index:200; max-width:min(540px,92vw); text-align:center}
:root[data-theme="dark"] .toast{background:#E4EDE9; color:#132420}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .toast{background:#E4EDE9; color:#132420}}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion: reduce){*{transition:none !important; animation:none !important}}

dialog{border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:16px; padding:0; max-width:min(560px,93vw); box-shadow:var(--shadow-lift)}
dialog::backdrop{background:rgba(12,22,20,.6)}
.dlg{padding:26px 28px 24px; display:flex; flex-direction:column; gap:15px}
.dlg h3{font-size:23px; font-weight:600}
.dlg p{margin:0; color:var(--ink-2); font-size:15px}
.dlg-actions{display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap}
.note{background:var(--notice-soft); border:1px solid color-mix(in srgb, var(--notice) 34%, transparent); border-radius:10px; padding:13px 15px; font-size:14.2px; color:var(--ink-2)}
.note b{color:var(--ink)}

.submitbox{
  margin-top:30px; border:1px solid var(--green); background:var(--green-soft);
  border-radius:13px; padding:24px 26px; display:flex; flex-direction:column; gap:14px; align-items:flex-start;
}
.submitbox h3{font-size:22px; font-weight:600; color:var(--display)}
.submitbox p{margin:0; font-size:15.4px; color:var(--ink-2); max-width:58ch; line-height:1.6}
.submit-status{font-size:14.6px; font-weight:600; margin:0}
.submit-status.ok{color:var(--green-ink)}
.submit-status.warn{color:var(--notice)}
.submit-status.err{color:var(--clay)}
.submit-alt{font-size:13.8px; color:var(--ink-3) !important; border-top:1px solid var(--line); padding-top:13px; width:100%}
.open-lede{font-size:19.5px; line-height:1.55; color:var(--ink); max-width:57ch; margin:18px 0 0; font-family:Newsreader,serif; font-weight:400}
.open-meta{display:flex; gap:24px; flex-wrap:wrap; margin-top:26px; font-size:14.4px; color:var(--ink-2)}
.open-meta div{display:flex; align-items:center; gap:9px}
.open-meta svg{color:var(--green); flex:none}

.prof{border:1px solid var(--line); background:var(--surface); border-radius:14px; padding:34px 38px; margin-top:24px; box-shadow:var(--shadow)}
.prof h1{font-size:32px; font-weight:600; letter-spacing:-.02em}
.prof .ph-sub{font-size:10.5px; letter-spacing:.15em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:9px}
.prof h4{font-family:"Source Sans 3",sans-serif; font-size:11px; letter-spacing:.13em; text-transform:uppercase; color:var(--green-ink); font-weight:700; margin:28px 0 10px; padding-bottom:7px; border-bottom:1px solid var(--line)}
.prof p.lead{font-size:17px; color:var(--ink); font-family:Newsreader,serif; line-height:1.5; margin-bottom:12px}
.prof p{margin:0 0 10px; font-size:15.2px; color:var(--ink-2); line-height:1.62; max-width:66ch; white-space:pre-wrap}
.prof .dl{display:grid; grid-template-columns:minmax(155px,auto) 1fr; gap:8px 22px; font-size:14.8px}
.prof .dl dt{color:var(--ink-3)}
.prof .dl dd{margin:0; color:var(--ink); font-weight:600}
.prof .miss{color:var(--clay); font-weight:400; font-style:italic}
.prof .chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px}
.prof .chips span{font-size:13px; background:var(--green-soft); color:var(--green-ink); border:1px solid color-mix(in srgb, var(--green) 30%, transparent); border-radius:99px; padding:3px 12px; font-weight:600}
.prof .pcard{border:1px solid var(--line); border-radius:10px; padding:13px 15px; margin-bottom:9px; background:var(--surface-2)}
.prof .pcard b{display:block; font-size:15.4px; color:var(--ink); margin-bottom:5px; font-family:Newsreader,serif; font-weight:600}
.prof .pcard span{display:block; font-size:13.8px; color:var(--ink-2)}
.prof .contactline{margin-top:10px; padding-bottom:4px; font-size:14px; color:var(--ink-2); display:flex; flex-wrap:wrap; align-items:center; gap:0 4px}
.prof .contactline .sep{color:var(--gold); margin:0 7px; font-weight:700}
.profbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:22px}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:static; height:auto; border-right:0; border-bottom:1px solid var(--line)}
  .rail.collapsed .navitem, .rail.collapsed .rail-foot{display:none}
  .main{padding:28px 20px 110px}
}
@media print{
  .topbar,.rail,.pager,.toast,.profbar{display:none !important}
  .main{padding:0; max-width:none}
  .prof{border:0; box-shadow:none; padding:0}
  body{background:#fff; color:#000}
}
</style>

/* ================= state ================= */
var KEY='fk-funding-profile-v3';
var STATE={v:3, lang:'fr', a:{}, t:null};
var saveTimer=null, current=0;

function load(){ try{ var r=localStorage.getItem(KEY); if(r){ var p=JSON.parse(r); if(p&&p.a){ STATE=p; LANG=p.lang||'fr'; } } }catch(e){} }
function persist(){ STATE.lang=LANG; STATE.t=new Date().toISOString(); try{ localStorage.setItem(KEY, JSON.stringify(STATE)); }catch(e){} }
function flagSaved(){
  var f=document.getElementById('saveflag'); f.classList.remove('saving');
  var d=STATE.t?new Date(STATE.t):null;
  document.getElementById('savetxt').textContent = d
    ? T('saved',{t:d.toLocaleTimeString(LANG==='fr'?'fr-FR':'en-GB',{hour:'2-digit',minute:'2-digit'})})
    : T('never');
}
function touch(){
  var f=document.getElementById('saveflag'); f.classList.add('saving');
  document.getElementById('savetxt').textContent=T('saving');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){ persist(); flagSaved(); refreshProgress(); }, 450);
}
function setA(id,v){ if(v===''||v==null||(Array.isArray(v)&&!v.length)) delete STATE.a[id]; else STATE.a[id]=v; touch(); }
function getA(id){ return STATE.a[id]; }
function has(id){ var v=STATE.a[id]; if(v==null) return false; if(Array.isArray(v)) return v.length>0; if(typeof v==='string') return v.trim()!==''; return true; }
function isGroup(v){ return Array.isArray(v) && v.length && typeof v[0]==='object' && !Array.isArray(v[0]); }
function fmtVal(v){
  if(v==null) return '';
  if(isGroup(v)) return v.map(function(o){ return Object.keys(o).map(function(k){ return o[k]; }).filter(function(x){ return String(x||'').trim()!==''; }).join(' — '); }).join('\n');
  if(Array.isArray(v)) return v.join(' · ');
  return String(v);
}
/* Options are stored as their bilingual "fr|en" key; dl() renders the
   half for the current language. Older saves hold plain text — passed
   through unchanged. */
function dl(x){ return (typeof x==='string' && x.indexOf('|')>=0) ? L(x) : x; }
function isOther(x){ return x==='Autre'||x==='Other'||x==='Autre|Other'; }
/* Replaces the "Autre" token with the text the respondent typed. */
function resolved(id){
  var v=getA(id);
  if(!Array.isArray(v)) return dl(v);
  var arr=v.map(dl), ot=STATE.a[id+'__other'];
  if(ot!=null&&String(ot).trim()!=='')
    arr=arr.map(function(x){ return isOther(x)?String(ot).trim():x; });
  return arr;
}
function raw(id){ return fmtVal(resolved(id)); }
function num(id){ var v=getA(id); if(v==null||v==='') return null; var n=Number(v); return isNaN(n)?null:n; }
function fmt(n){ return n==null?null:n.toLocaleString(LANG==='fr'?'fr-FR':'en-GB'); }

function formSections(){ return SECTIONS.filter(function(s){ return s.qs && s.qs.length; }); }
function secStats(s){ var n=s.qs?s.qs.length:0, d=0; if(s.qs) s.qs.forEach(function(q){ if(has(q.id)) d++; }); return {n:n,d:d}; }
function overall(){ var n=0,d=0; formSections().forEach(function(s){ var t=secStats(s); n+=t.n; d+=t.d; }); return {n:n,d:d,p:n?Math.round(d/n*100):0}; }

/* ================= rendering ================= */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function el(t,c,h){ var e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; }

function renderNav(){
  var box=document.getElementById('navlist'); box.innerHTML='';
  SECTIONS.forEach(function(s,i){
    var b=el('button','navitem'); b.type='button';
    b.setAttribute('aria-current', i===current?'true':'false');
    var st=s.qs?secStats(s):null, ring='';
    if(st&&st.n){
      var C=2*Math.PI*7, on=C*(st.d/st.n);
      ring='<svg class="navring" viewBox="0 0 17 17"><circle class="trk" cx="8.5" cy="8.5" r="7"></circle>'+
           '<circle class="val" cx="8.5" cy="8.5" r="7" stroke-dasharray="'+on.toFixed(2)+' '+C.toFixed(2)+'"></circle></svg>';
    }
    b.innerHTML='<span class="navnum">'+(s.qs?String(i):'·')+'</span><span>'+esc(L(s.nav))+'</span>'+ring;
    b.onclick=function(){ go(i); };
    box.appendChild(b);
  });
}
function refreshProgress(){
  var o=overall();
  document.getElementById('pctnum').textContent=o.p+'%';
  document.getElementById('pctsub').textContent=o.d+' '+T('answered',{n:o.n});
  document.getElementById('pctbar').style.width=o.p+'%';
  renderNav();
}
function markDone(id){ var c=document.getElementById('q_'+id); if(c) c.classList.toggle('done', has(id)); }

function fieldFor(q){
  var w=el('div','qbody'), v=getA(q.id);
  if(q.t==='text'){
    var i=el('input'); i.type='text'; i.value=v==null?'':v;
    i.oninput=function(){ setA(q.id,i.value); markDone(q.id); }; w.appendChild(i);
  } else if(q.t==='money'){

    var b2=el('div','opts'+(q.o.length>4?' grid':''));

    q.o.forEach(function(o){
      var val=L(o), sel=idxOf(cur,o)>=0;

      c.onchange=function(){

      lab.appendChild(c); lab.appendChild(el('span',null,esc(val))); b2.appendChild(lab);
    });
    w.appendChild(b2);

    var blank=function(){ var o={}; q.fields.forEach(function(f){ o[f.k]=''; }); return o; };

    var box=el('div','grp'), body=el('div','grp');
    function commit(){
      var keep=items.filter(function(o){ return q.fields.some(function(f){ return String(o[f.k]||'').trim()!==''; }); });
      setA(q.id, keep.length?keep:null); markDone(q.id);

    function draw(){
      body.innerHTML='';
      items.forEach(function(item,ix){
        var card=el('div','grp-card');
        var head=el('div','grp-head');
        head.appendChild(el('b',null, esc(L(q.itemLabel))+' '+(ix+1)));
        var del=el('button','grp-del','&times;'); del.type='button';
        del.setAttribute('aria-label', LANG==='fr'?'Supprimer':'Remove');
        del.onclick=function(){ items.splice(ix,1); if(!items.length) items.push(blank()); draw(); commit(); };
        head.appendChild(del); card.appendChild(head);
        var fw=el('div','grp-fields');
        q.fields.forEach(function(f){
          var cell=el('div','grp-f'+(f.wide?' wide':''));
          var id='g_'+q.id+'_'+ix+'_'+f.k;
          var lb=el('label',null,esc(L(f.l))); lb.setAttribute('for',id); cell.appendChild(lb);
          var inp = f.long ? el('textarea') : el('input');
          if(!f.long) inp.type = f.num?'number':'text';
          inp.id=id; inp.value=item[f.k]||''; if(f.ph) inp.placeholder=f.ph;
          inp.oninput=function(){ items[ix][f.k]=inp.value; commit(); };
          cell.appendChild(inp); fw.appendChild(cell);
        });
        card.appendChild(fw); body.appendChild(card);
      });
    }
    draw();
    box.appendChild(body);
    var add=el('button','grp-add'); add.type='button'; add.textContent=L(q.addLabel);
    add.onclick=function(){ items.push(blank()); draw(); };
    box.appendChild(add);
    w.appendChild(box);
  }
  return w;
}

var ENDPOINT='https://script.google.com/macros/s/AKfycbyuz5-bhV8_th56y55Nk3o6c6JvN93uB9x6MSTewaVFNKq-KMAMSBOaBOTs0V-qNRCP/exec';
var SENT_KEY='fk-funding-profile-sent';

function sentAt(){ try{ return localStorage.getItem(SENT_KEY)||''; }catch(e){ return ''; } }
function markSent(){ try{ localStorage.setItem(SENT_KEY, new Date().toISOString()); }catch(e){} }

function renderSubmit(m){
  var isFr=LANG==='fr', o=overall();
  var box=el('div','submitbox');
  box.innerHTML =
    '<h3>'+(isFr?'Envoyer vos réponses':'Send your answers')+'</h3>'+
    '<p>'+(isFr
      ? 'Tant que vous n’avez pas cliqué sur ce bouton, vos réponses restent uniquement sur cet appareil et ne nous parviennent pas.'
      : 'Until you press this button your answers stay on this device only and do not reach us.')+'</p>';
  var btn=el('button','btn primary big'); btn.type='button';
  btn.textContent=isFr?'Envoyer mes réponses':'Send my answers';
  var status=el('p','submit-status');
  var prev=sentAt();
  if(prev){
    var d=new Date(prev);
    status.className='submit-status ok';
    status.textContent=(isFr?'Déjà envoyé le ':'Already sent on ')+
      d.toLocaleDateString(isFr?'fr-FR':'en-GB')+(isFr?' à ':' at ')+
      d.toLocaleTimeString(isFr?'fr-FR':'en-GB',{hour:'2-digit',minute:'2-digit'})+
      (isFr?'. Vous pouvez renvoyer une version corrigée.':'. You can send a corrected version.');
  }
  btn.onclick=function(){
    btn.disabled=true;
    status.className='submit-status';
    status.textContent=isFr?'Envoi en cours…':'Sending…';
    var payload=JSON.stringify({lang:LANG, progress:overall().p, a:STATE.a});
    /* plain string body => text/plain => a simple request, no preflight */
    fetch(ENDPOINT,{method:'POST',body:payload})
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(j&&j.ok){ done(); }
        else { throw new Error(j&&j.error?j.error:'refus du serveur'); }
      })
      .catch(function(){
        /* the reply could not be read; send again opaquely so the data
           still arrives, then say plainly that we cannot confirm it */
        return fetch(ENDPOINT,{method:'POST',mode:'no-cors',body:payload})
          .then(function(){ doneUnconfirmed(); })
          .catch(function(){ failed(); });
      });
    function done(){
      markSent(); btn.disabled=false;
      status.className='submit-status ok';
      status.textContent=isFr
        ? 'Réponses bien reçues. Merci.'
        : 'Answers received. Thank you.';
      toast(isFr?'Vos réponses nous sont parvenues.':'Your answers have reached us.');
    }
    function doneUnconfirmed(){
      markSent(); btn.disabled=false;
      status.className='submit-status warn';
      status.textContent=isFr
        ? 'Envoi effectué, mais la confirmation n’a pas pu être lue. Par précaution, téléchargez aussi la sauvegarde et envoyez-la-nous.'
        : 'Sent, but the confirmation could not be read. As a precaution, download the save file as well and send it to us.';
    }
    function failed(){
      btn.disabled=false;
      status.className='submit-status err';
      status.textContent=isFr
        ? 'L’envoi a échoué — probablement la connexion. Réessayez, ou téléchargez la sauvegarde et envoyez-la-nous par courriel.'
        : 'Sending failed — most likely the connection. Try again, or download the save file and email it to us.';
    }
  };
  box.appendChild(btn);
  box.appendChild(status);
  var alt=el('p','submit-alt');
  alt.innerHTML=(isFr
    ? 'Connexion instable&nbsp;? Utilisez <b>Sauvegarder pour reprendre</b> dans le menu de gauche et envoyez-nous le fichier obtenu.'
    : 'Unstable connection? Use <b>Save to continue later</b> in the left-hand menu and send us the file it produces.');
  box.appendChild(alt);
  m.appendChild(box);
}

/* Narrative builder: stitches answers into prose, silently skipping
   any sentence whose inputs are missing. Returns plain text. */
function lower1(s){ return s?s.charAt(0).toLowerCase()+s.slice(1):s; }
/* lc:true lowercases each item — correct for common nouns used mid-sentence
   in French. Leave it off for place names and other proper nouns. */
function list(id,opt){
  if(!has(id)) return null;
  opt=opt||{};
  var v=resolved(id); if(!Array.isArray(v)) return String(v);
  var a=v.slice().map(function(x){ return opt.lc?lower1(String(x)):String(x); });
  if(a.length===1) return a[0];
  return a.slice(0,-1).join(', ')+' '+(LANG==='fr'?'et':'and')+' '+a[a.length-1];
}
function money(id){ var n=num(id); return n==null?null:fmt(n)+' USD'; }
function para(parts){ return parts.filter(function(x){return x;}).join(' '); }

function narrIdentity(){

  if(has('legal_status')||has('reg_year')){

      (has('reg_year')?', enregistrée en '+raw('reg_year'):'')+'.');

                               :('It is legally registered or authorised to operate in: '+raw('countries')+'.'));

    var f=raw('foreign_funds');

var DL=null, DL_DONE=false;
function getDL(){
  if(DL_DONE) return Promise.resolve(DL);
  DL_DONE=true;
  try{
    if(window.claude && typeof window.claude.use==='function')
      return window.claude.use('downloads').then(function(d){ DL=d; return d; }).catch(function(){ return null; });
  }catch(e){}
  return Promise.resolve(null);
}
function blobSave(fn,data,mime){
  try{
    var url=URL.createObjectURL(new Blob([data],{type:mime}));
    var a=document.createElement('a'); a.href=url; a.download=fn;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },1500);
    return true;
  }catch(e){ return false; }
}
function deliver(fn,data,mime,altFn,altData){
  return getDL().then(function(dl){
    if(!dl) return blobSave(fn,data,mime)?'saved':'failed';
    return dl.save({filename:fn,data:data}).then(function(){return 'saved';}).catch(function(err){
      var c=err&&err.code;
      if(c==='declined') return 'declined';
      if(c==='rate_limited') return 'busy';
      if((c==='extension_not_enabled'||c==='rejected_extension')&&altFn)
        return dl.save({filename:altFn,data:altData}).then(function(){return 'alt';}).catch(function(){return 'failed';});
      return blobSave(fn,data,mime)?'saved':'failed';
    });
  });
}
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove('show'); },4200);
}
function stamp(){ var d=new Date(); return ''+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'); }
function report(r,ok){
  var isFr=LANG==='fr';
  if(r==='saved') toast(ok);
  else if(r==='alt') toast(isFr?'PDF indisponible ici — version texte téléchargée.':'PDF unavailable here — text version downloaded.');
  else if(r==='declined') toast(isFr?'Téléchargement annulé.':'Download cancelled.');
  else if(r==='busy') toast(isFr?'Un téléchargement est déjà en cours.':'A download is already in progress.');
  else toast(isFr?'Le téléchargement n’a pas abouti.':'The download did not complete.');
}

/* ---- PDF ---- */
function pdfEsc(s){ return s.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)'); }
var WA={'‘':0x91,'’':0x92,'“':0x93,'”':0x94,'–':0x96,'—':0x97,'•':0x95,'…':0x85,'€':0x80,'Œ':0x8C,'œ':0x9C,' ':0x20};
function winAnsi(s){
  var o='';
  for(var i=0;i<s.length;i++){
    var ch=s[i], c=s.charCodeAt(i);
    if(WA[ch]!=null) o+=String.fromCharCode(WA[ch]);
    else if(c<=0xFF) o+=ch; else o+='?';
  }
  return o;
}
function makePDF(title, blocks){
  var PW=595.28, PH=841.89, ML=54, MR=54, MT=70, MB=56, maxW=PW-ML-MR;
  var GREEN=[0.180,0.420,0.290], BROWN=[0.106,0.227,0.173], INK=[0.110,0.137,0.125], GREY=[0.40,0.44,0.42], GOLD=[0.180,0.420,0.290], RULE=[0.85,0.88,0.86];
  var pages=[], cur=[], y=PH-MT;
  function wOf(t,s,b){ return t.length*s*(b?0.545:0.505); }
  function wrap(t,s,b,W){
    var out=[];
    String(t).split('\n').forEach(function(para){
      var ws=para.replace(/\s+/g,' ').trim().split(' '), line='';
      if(!ws.length||ws[0]===''){ out.push(''); return; }
      for(var i=0;i<ws.length;i++){
        var c=line?line+' '+ws[i]:ws[i];
        if(wOf(c,s,b)>W&&line){ out.push(line); line=ws[i]; } else line=c;
      }
      if(line) out.push(line);
    });
    return out.length?out:[''];
  }
  function page(){ pages.push(cur); cur=[]; y=PH-MT; }
  function need(h){ if(y-h<MB) page(); }
  function txt(t,o){
    o=o||{};
    var s=o.size||9.6, b=!!o.bold, col=o.col||INK, ind=o.ind||0, lh=o.lh||s*1.42;
    wrap(t,s,b,maxW-ind).forEach(function(ln){ need(lh); cur.push({k:'t',s:ln,size:s,bold:b,x:ML+ind,y:y,c:col}); y-=lh; });
  }
  function gap(h){ need(h); y-=h; }
  function rule(c,w){ need(10); cur.push({k:'r',y:y+4,x1:ML,x2:PW-MR,c:c||RULE,w:w||0.7}); y-=10; }
  function lines(n){ for(var i=0;i<(n||2);i++){ need(15); cur.push({k:'r',y:y,x1:ML+14,x2:PW-MR,c:RULE,w:0.6}); y-=15; } y-=3; }

  txt(title,{size:19,bold:true,col:BROWN,lh:24}); gap(3); rule(GREEN,1.4); gap(6);
  blocks.forEach(function(b){
    if(b.k==='h'){ gap(11); txt(b.t,{size:12,bold:true,col:GREEN,lh:16.5}); rule(); }
    else if(b.k==='sub'){ txt(b.t,{size:9,col:GREY,lh:12.5}); gap(4); }
    else if(b.k==='q'){ gap(6); txt(b.n?b.n+'.  '+b.t:b.t,{size:9.8,bold:true,lh:13.5}); }
    else if(b.k==='hint'){ txt(b.t,{size:8.4,col:GOLD,ind:14,lh:11.5}); }
    else if(b.k==='opt'){ txt('[  ]  '+b.t,{size:9,ind:14,lh:12.5}); }
    else if(b.k==='ans'){ txt(b.t,{size:9.4,ind:14,lh:13}); gap(2); }
    else if(b.k==='blank'){ lines(b.n||2); }
    else if(b.k==='gap'){ gap(b.n||8); }
  });
  page();

  var objs=[];
  objs.push('<< /Type /Catalog /Pages 2 0 R >>');
  objs.push('');
  objs.push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  objs.push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  var kids=[], first=5;
  pages.forEach(function(ops,pi){
    var pn=first+pi*2, cn=pn+1, sc='';
    ops.forEach(function(o){
      if(o.k==='t'){
        sc+=o.c[0].toFixed(3)+' '+o.c[1].toFixed(3)+' '+o.c[2].toFixed(3)+' rg\n';
        sc+='BT /'+(o.bold?'F2':'F1')+' '+o.size+' Tf 1 0 0 1 '+o.x.toFixed(2)+' '+o.y.toFixed(2)+' Tm ('+pdfEsc(winAnsi(o.s))+') Tj ET\n';
      } else {
        sc+=o.c[0].toFixed(3)+' '+o.c[1].toFixed(3)+' '+o.c[2].toFixed(3)+' RG '+o.w+' w\n';
        sc+=o.x1.toFixed(2)+' '+o.y.toFixed(2)+' m '+o.x2.toFixed(2)+' '+o.y.toFixed(2)+' l S\n';
      }
    });
    objs[pn-1]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+PH+'] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+cn+' 0 R >>';
    objs[cn-1]='<< /Length '+sc.length+' >>\nstream\n'+sc+'endstream';
    kids.push(pn+' 0 R');
  });
  objs[1]='<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+pages.length+' >>';

  var out='%PDF-1.4\n', offs=[];
  for(var i=0;i<objs.length;i++){ offs.push(out.length); out+=(i+1)+' 0 obj\n'+objs[i]+'\nendobj\n'; }
  var xr=out.length;
  out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n';
  offs.forEach(function(o){ out+=String(o).padStart(10,'0')+' 00000 n \n'; });
  out+='trailer\n<< /Size '+(objs.length+1)+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF';
  var by=new Uint8Array(out.length);
  for(var j=0;j<out.length;j++) by[j]=out.charCodeAt(j)&0xFF;
  return by;
}
function qBlocks(withAnswers){
  var b=[], isFr=LANG==='fr';
  b.push({k:'sub',t:isFr
    ? 'L’objectif de ce questionnaire est de recueillir les informations essentielles permettant de comprendre le profil de la Fondation Kibira et d’identifier les opportunités de financement qui lui correspondent réellement.'
    : 'The purpose of this questionnaire is to gather the essential information needed to understand Fondation Kibira’s profile and identify the funding opportunities that genuinely match it.'});
  SECTIONS.forEach(function(s){
    if(!s.qs||!s.qs.length) return;
    b.push({k:'h',t:L(s.title).toUpperCase()});
    s.qs.forEach(function(q){
      b.push({k:'q',n:qNumber(q.id),t:L(q.q)});
      if(q.h) b.push({k:'hint',t:L(q.h)});
      var v=resolved(q.id);
      if(withAnswers&&v!=null&&v!==''&&!(Array.isArray(v)&&!v.length)){
        fmtVal(v).split('\n').forEach(function(ln){ b.push({k:'ans',t:ln}); });
      }
      else if(q.t==='group'){
        b.push({k:'hint',t:q.fields.map(function(f){return L(f.l);}).join('  ·  ')});
        b.push({k:'blank',n:6});
      }
      else if(q.t==='one'||q.t==='many'){ q.o.forEach(function(o){ b.push({k:'opt',t:L(o)}); }); b.push({k:'gap',n:4}); }
      else b.push({k:'blank',n:q.t==='long'?3:1});
    });
  });
  return b;
}
function toText(blocks,title){
  return title+'\n\n'+blocks.map(function(x){
    if(x.k==='h') return '\n\n== '+x.t+' ==';
    if(x.k==='q') return '\n'+(x.n?x.n+'. ':'')+x.t;
    if(x.k==='opt') return '   [ ] '+x.t;
    if(x.k==='hint') return '   '+x.t;
    if(x.k==='ans') return '   > '+x.t;
    return x.t||'';
  }).join('\n');
}

   [T('upload'), icon('<path d="M10 16V7M6.5 10.5L10 7l3.5 3.5"/><path d="M4 4h12"/>'), function(){ document.getElementById('filein').click(); }],
   [T('profile'), icon('<circle cx="10" cy="7" r="2.6"/><path d="M4.5 16c.7-3 2.9-4.4 5.5-4.4s4.8 1.4 5.5 4.4"/>'), function(){ go(SECTIONS.length-1); }],
   [T('reset'), icon('<path d="M6 6l8 8M14 6l-8 8"/>'), function(){ document.getElementById('dlgReset').showModal(); }]
  ].forEach(function(it){
    var b=el('button','railbtn'); b.type='button';
    b.innerHTML=it[1]+'<span>'+esc(it[0])+'</span>'; b.onclick=it[2]; f.appendChild(b);
  });
}
function setLang(l,silent){
  LANG=(l==='en')?'en':'fr';
  document.documentElement.lang=LANG;
  [].forEach.call(document.querySelectorAll('[data-lang]'),function(b){
    b.setAttribute('aria-pressed', b.getAttribute('data-lang')===LANG?'true':'false');
  });
  var bs=document.querySelector('[data-i="brandsub"]'); if(bs) bs.textContent=T('brandsub');
  document.querySelector('[data-i="progress"]').textContent=T('progress');
  if(!silent){ persist(); renderFoot(); refreshProgress(); renderSection(current); flagSaved(); }
}
function init(){
  load();
  document.documentElement.lang=LANG;
  [].forEach.call(document.querySelectorAll('[data-lang]'),function(b){
    b.onclick=function(){ setLang(b.getAttribute('data-lang')); };
    b.setAttribute('aria-pressed', b.getAttribute('data-lang')===LANG?'true':'false');
  });
  document.getElementById('menubtn').onclick=function(){ document.getElementById('rail').classList.toggle('collapsed'); };
  if(window.innerWidth<=900) document.getElementById('rail').classList.add('collapsed');

  var fi=el('input'); fi.type='file'; fi.id='filein'; fi.accept='.json,.pdf,.docx,.png,.jpg,.jpeg'; fi.style.display='none';
  fi.onchange=function(){ if(fi.files&&fi.files[0]) handleUpload(fi.files[0]); fi.value=''; };
  document.body.appendChild(fi);

  var dlg=el('dialog'); dlg.id='dlgReset';
  dlg.innerHTML='<div class="dlg"><h3></h3><p></p><div class="dlg-actions">'+
    '<button type="button" class="btn" value="no"></button>'+
    '<button type="button" class="btn primary" value="yes"></button></div></div>';
  document.body.appendChild(dlg);
  var show=dlg.showModal.bind(dlg);
  dlg.showModal=function(){
    var fr=LANG==='fr';
    dlg.querySelector('h3').textContent=fr?'Tout effacer ?':'Clear everything?';
    dlg.querySelector('p').textContent=fr
      ? 'Toutes les réponses enregistrées sur cet appareil seront supprimées. Sauvegardez d’abord un fichier si vous souhaitez pouvoir revenir en arrière.'
      : 'Every answer stored on this device will be deleted. Save a file first if you want to be able to come back.';
    dlg.querySelector('[value="no"]').textContent=fr?'Annuler':'Cancel';
    dlg.querySelector('[value="yes"]').textContent=fr?'Effacer':'Clear';
    show();
  };
  dlg.addEventListener('click',function(e){
    if(e.target.value==='no') dlg.close();
    if(e.target.value==='yes'){
      STATE.a={}; persist(); flagSaved(); refreshProgress(); renderSection(current); dlg.close();
      toast(LANG==='fr'?'Questionnaire remis à zéro.':'Questionnaire cleared.');
    }
  });

  window.addEventListener('dragover',function(e){ e.preventDefault(); });
  window.addEventListener('drop',function(e){
    e.preventDefault();
    if(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]) handleUpload(e.dataTransfer.files[0]);
  });

  renderFoot(); refreshProgress(); flagSaved();
  var resumed=Object.keys(STATE.a).length>0;
  go(resumed?1:0);
  if(resumed) setTimeout(function(){
    toast(LANG==='fr'?'Vos réponses précédentes ont été retrouvées.':'Your earlier answers were found.');
  },600);
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
</script>
</body>
</html>
